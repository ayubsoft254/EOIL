{% extends 'base.html' %}

{% block title %}Staff login · EOIL Taita Taveta University{% endblock %}

{% block content %}
<section class="mx-auto max-w-md px-4 py-20 sm:px-6">
  <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-extrabold text-slate-900">Staff login</h1>
    <p class="mt-1 text-sm text-slate-500">Sign in to access the event check-in desk.</p>
    {% if form.errors %}
      <p class="mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
        Invalid username or password.
      </p>
    {% endif %}
    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_username" class="mb-1 block text-sm font-medium text-slate-700">Username</label>
        <input type="text" name="username" id="id_username" required autofocus
               class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-600/20">
      </div>
      <div>
        <label for="id_password" class="mb-1 block text-sm font-medium text-slate-700">Password</label>
        <input type="password" name="password" id="id_password" required
               class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-600/20">
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit"
              class="w-full rounded-xl bg-brand-700 px-4 py-3 text-sm font-bold text-white hover:bg-brand-800">
        Sign in
      </button>
    </form>
  </div>
</section>
{% endblock %}
